<meta charset="utf-8">
<title>Blank Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a full-bleed nautical chart with a docked title block below it. The palette follows
   chart conventions: buff land, tinted water, magenta for marked positions. Dark is night mode. */
:root {
  --sea: #cfe4ee; --land: #f1e4b8; --coast: #5f6c60; --border: #4f4733; --grid: #a9c6d4;
  --panel: #f7fafa; --panel-2: #e8f0f2; --ink: #12303e; --muted: #4d6673; --line: #bfd0d6;
  --mark: #b0117a; --mark-ink: #ffffff; --pin: #12303e; --pick: #1769aa;
  --good: #1c7a4c; --ok: #a96a00; --bad: #bd3b1e; --river: #9fc6dc; --peak: #8c6a3f;
  --display: "Barlow Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --sea: #0a1a26; --land: #38392a; --coast: #8d9885; --border: #c4c6a8; --grid: #1c3444;
  --panel: #0f222e; --panel-2: #173140; --ink: #dfeaee; --muted: #9db3bd; --line: #2a4453;
  --mark: #f472c8; --mark-ink: #2a0a20; --pin: #ffffff; --pick: #58b4f0;
  --good: #5fce96; --ok: #e6ad4d; --bad: #f08a6c; --river: #2f5a75; --peak: #b49a76; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --sea: #0a1a26; --land: #38392a; --coast: #8d9885; --border: #c4c6a8; --grid: #1c3444;
  --panel: #0f222e; --panel-2: #173140; --ink: #dfeaee; --muted: #9db3bd; --line: #2a4453;
  --mark: #f472c8; --mark-ink: #2a0a20; --pin: #ffffff; --pick: #58b4f0;
  --good: #5fce96; --ok: #e6ad4d; --bad: #f08a6c; --river: #2f5a75; --peak: #b49a76; color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body { background: var(--sea); color: var(--ink); font: 15px/1.45 var(--body); overflow: hidden; }
* { box-sizing: border-box; }
#app { height: 100%; display: grid; grid-template-rows: minmax(0, 1fr) auto; }

#stage { position: relative; min-height: 0; overflow: hidden; background: var(--sea); }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#map.placing { cursor: crosshair; }
#map:active { cursor: grabbing; }
#map path { vector-effect: non-scaling-stroke; }
.sphere { fill: var(--sea); stroke: var(--grid); stroke-width: 1; }
.graticule { fill: none; stroke: var(--grid); stroke-width: .6; }
.land { fill: var(--land); stroke: var(--coast); stroke-width: .8; }
.borders { fill: none; stroke: var(--border); stroke-width: 1; stroke-linejoin: round; }
#map .relief-rivers { fill: none; stroke: var(--river); stroke-width: .7; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
#map .relief-peak { fill: var(--peak); stroke: var(--land); stroke-width: .5; pointer-events: none; }
#map .hl-area { fill: var(--mark); fill-opacity: .62; stroke: var(--mark); stroke-width: 1.4; }
#map .hl-river { fill: none; stroke: var(--mark); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
#map .hl-river-halo { fill: none; stroke: var(--panel); stroke-width: 6; stroke-opacity: .75; stroke-linecap: round; stroke-linejoin: round; }
#map .hl-right { fill: var(--good); fill-opacity: .7; stroke: var(--good); stroke-width: 1.4; }
#map .hl-chosen { fill: var(--bad); fill-opacity: .6; stroke: var(--bad); stroke-width: 1.4; }
#map .sel-hover { fill: var(--pick); fill-opacity: .25; stroke: var(--pick); stroke-width: 1; pointer-events: none; }
#map .gap { fill: none; stroke: var(--pin); stroke-width: 1.6; stroke-dasharray: 5 5; }
#sparks { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.m-dot { fill: var(--mark); stroke: var(--panel); stroke-width: 2; }
.m-ring { fill: none; stroke: var(--mark); stroke-width: 2.5; }
.m-peak { fill: var(--mark); stroke: var(--panel); stroke-width: 2; stroke-linejoin: round; }
.m-pin { fill: none; stroke: var(--pin); stroke-width: 2.5; }
.m-pin-c { fill: var(--pin); }
.m-pin-halo { fill: none; stroke: var(--panel); stroke-width: 5; stroke-opacity: .7; }

#zoomctl { position: absolute; display: grid; gap: 6px;
  top: calc(12px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); }
#zoomctl button { width: 38px; height: 38px; padding: 0; font: 600 20px/1 var(--body); }
#topbar { position: absolute; display: flex; gap: 8px;
  top: calc(12px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); }
#lang { display: flex; }
#music { order: 1; height: 38px; padding: 0 12px; font: 600 15px/1 var(--display); letter-spacing: .04em; white-space: nowrap; }
#music[aria-pressed="false"] { color: var(--muted); border-color: var(--line); }
#volume-box { order: 2; display: flex; align-items: center; height: 38px; padding: 0 10px; background: var(--panel); border: 1px solid var(--ink); border-radius: 3px; }
#volume-box[hidden] { display: none; }
#volume-box.off { border-color: var(--line); }
#volume { width: 84px; margin: 0; accent-color: var(--mark); cursor: pointer; }
#legend { position: absolute; bottom: 8px; right: max(12px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 3px 10px;
  padding: 4px 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 3px; font-size: 12px; pointer-events: none; }
#legend[hidden] { display: none; }
#legend span { display: flex; align-items: center; gap: 5px; }
#legend i { width: 10px; height: 10px; }
#legend .hl-right { background: var(--good); } #legend .hl-chosen { background: var(--bad); } #legend .hl-area { background: var(--mark); }
.status-end { display: flex; align-items: center; gap: 12px; }
#quit { padding: 4px 10px; font-size: 13px; }
.ended { margin: 0; color: var(--muted); }
#lang button { min-width: 42px; height: 38px; padding: 0 10px; font: 600 15px/1 var(--display); letter-spacing: .06em; }
#lang button:first-child { border-radius: 3px 0 0 3px; }
#lang button:last-child { border-radius: 0 3px 3px 0; margin-left: -1px; }
#lang button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
#readout { position: absolute; bottom: 8px; left: max(12px, env(safe-area-inset-left, 0px));
  font: 12px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; pointer-events: none; }
@media (hover: none) { #readout { display: none; } }

#dock { background: var(--panel); border-top: 2px solid var(--ink); max-height: 66vh; overflow-y: auto;
  padding-block: 14px calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1120px; margin-inline: auto; display: grid; gap: 10px; }

button { font: 500 14px/1.2 var(--body); color: var(--ink); background: var(--panel); border: 1px solid var(--ink);
  border-radius: 3px; padding: 9px 14px; cursor: pointer; }
button:hover:not(:disabled) { background: var(--panel-2); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--mark); border-color: var(--mark); color: var(--mark-ink); font-weight: 600; }
button.primary:hover:not(:disabled) { background: var(--mark); filter: brightness(1.1); }
button.quiet { border-color: var(--line); color: var(--muted); }
:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }

/* Setup */
.setup { grid-template-columns: minmax(180px, 250px) minmax(0, 1fr); gap: 14px 32px; }
.brand h1 { font: 700 44px/.95 var(--display); margin: 0 0 6px; letter-spacing: .005em; text-transform: uppercase; }
.brand p { margin: 0 0 12px; color: var(--muted); }
.brand small { display: block; color: var(--muted); font-size: 12px; line-height: 1.4; }
.options { display: grid; gap: 10px; min-width: 0; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { padding: 0; margin-bottom: 5px; font: 600 15px/1.2 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; margin: 0; width: 100%; height: 100%; cursor: pointer; }
.chip span { display: block; padding: 7px 12px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); }
.chip span i { font: 12px var(--mono); font-style: normal; color: var(--muted); margin-left: 5px; }
.chip input:checked + span { background: var(--ink); border-color: var(--ink); color: var(--panel); font-weight: 500; }
.chip input:checked + span i { color: inherit; }
.chip input:focus-visible + span { outline: 3px solid var(--mark); outline-offset: 2px; }
.start { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.start button { padding: 11px 28px; font-size: 16px; }
.start span { color: var(--muted); }

/* In play */
.status { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 16px; }
.eyebrow { font: 600 15px/1.2 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.total { font: 500 13px var(--mono); font-variant-numeric: tabular-nums; }
.tally { display: flex; gap: 3px; list-style: none; margin: 0; padding: 0; }
.tally li { width: 20px; height: 6px; background: var(--panel-2); }
.tally li.now { background: var(--ink); }
.tally li.good { background: var(--good); } .tally li.ok { background: var(--ok); } .tally li.bad { background: var(--bad); }
.prompt { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px; }
.prompt > div:first-child { min-width: 0; flex: 1 1 300px; }
.prompt h2 { font: 600 34px/1.05 var(--display); margin: 0; text-wrap: balance; }
.prompt p { margin: 3px 0 0; color: var(--muted); }
.prompt h2 .target { color: var(--mark); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.answer-form { display: flex; flex-wrap: wrap; gap: 8px; flex: 1 1 340px; max-width: 560px; }
.answer-form input { flex: 1 1 180px; min-width: 0; padding: 9px 12px; font: 500 16px var(--body); color: var(--ink);
  background: var(--panel); border: 1px solid var(--ink); border-radius: 3px; }
.verdict { display: inline-block; font: 600 13px/1 var(--mono); padding: 4px 7px; border-radius: 2px; color: var(--panel); margin-right: 8px; vertical-align: 4px; font-variant-numeric: tabular-nums; }
.verdict.good { background: var(--good); } .verdict.ok { background: var(--ok); } .verdict.bad { background: var(--bad); }

/* Round summary */
.summary-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px; }
.summary-head h2 { font: 700 40px/1 var(--display); margin: 0; font-variant-numeric: tabular-nums; }
.summary-head h2 small { font: 500 24px var(--display); color: var(--muted); }
.rank { font: 600 20px var(--display); color: var(--mark); margin-left: 12px; }
.rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 0 28px; }
.rows button { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: baseline; width: 100%; text-align: left;
  background: none; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 7px 2px; }
.rows button em { font-style: normal; color: var(--muted); font-size: 13px; margin-left: 6px; }
.rows button b { font: 500 13px var(--mono); font-variant-numeric: tabular-nums; }
.rows button b.good { color: var(--good); } .rows button b.ok { color: var(--ok); } .rows button b.bad { color: var(--bad); }
.rows button.active { background: var(--panel-2); }

@media (max-width: 720px) {
  .setup { grid-template-columns: minmax(0, 1fr); }
  .brand h1 { font-size: 36px; }
  .brand small { display: none; }
  .brand p { margin-bottom: 0; }
  .prompt h2 { font-size: 28px; }
  .tally li { width: 14px; }
  #dock { max-height: 72vh; }
}
</style>

<div id="app">
  <div id="stage">
    <svg id="map" role="application" aria-label="World map"></svg>
    <canvas id="sparks" aria-hidden="true"></canvas>
    <div id="topbar">
    <button id="music" type="button"></button>
    <label id="volume-box"><input id="volume" type="range" min="0" max="100" step="1"></label>
    <div id="lang" role="group">
      <button type="button" data-lang="de">DE</button>
      <button type="button" data-lang="en">EN</button>
    </div>
    </div>
    <div id="legend" hidden></div>
    <div id="zoomctl">
      <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
      <button id="zoom-out" type="button" aria-label="Zoom out">&minus;</button>
      <button id="zoom-home" type="button" aria-label="Show the whole region" title="Show the whole region">&#8982;</button>
    </div>
    <div id="readout" aria-hidden="true"></div>
  </div>
  <section id="dock" aria-live="polite"></section>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="data.js"></script>
<script>
"use strict";
const DATA = window.BLANK_MAP_DATA;
const EARTH_KM = 6371;
const ROUND_LENGTH = 10;
const KINDS = ["country", "capital", "mountain", "river"];
const REGIONS = {
  World: { rotate: 0 },
  Africa: { rotate: 0, box: [-20, -36, 55, 38] },
  Asia: { rotate: 0, box: [25, -12, 150, 56] },
  Europe: { rotate: 0, box: [-25, 34, 45, 71] },
  "North America": { rotate: 0, box: [-170, 7, -50, 74] },
  "South America": { rotate: 0, box: [-85, -57, -32, 14] },
  Oceania: { rotate: -165, box: [112, -48, 208, 23] },
};

/* ---------- Language ---------- */
const STRINGS = {
  en: {
    kinds: { country: "Countries", capital: "Capitals", mountain: "Mountains", river: "Rivers" },
    one: { country: "Country", capital: "Capital city", mountain: "Mountain", river: "River" },
    nameThis: { country: "Name this country", capital: "Name this capital city", mountain: "Name this mountain", river: "Name this river" },
    regions: { World: "World", Africa: "Africa", Asia: "Asia", Europe: "Europe", "North America": "North America", "South America": "South America", Oceania: "Oceania", Antarctica: "Antarctica" },
    types: { both: "Both", name: "Name it", find: "Find it" },
    intro: "Name places on an unlabelled world map, or find them from their name.",
    credit: "Map data: Natural Earth, public domain. Countries are the UN members plus Kosovo, Palestine, Taiwan and Vatican City. Borders are drawn for play and take no political position.",
    legendAsk: "What to ask", legendHow: "How to answer", legendWhere: "Where", start: "Start round",
    startNote: "{n} questions, up to 100 points each", startEmpty: "Choose something to ask about in this region.",
    question: "Question {i} of {n}", points: "pts", find: "Find {name}",
    hintPin: "Click the map to place your pin. Scroll or pinch to zoom.",
    hintCountry: "Your click on a country is your answer. Scroll or pinch to zoom.",
    hintSpelling: "Small spelling mistakes are fine.", placeholder: "Type the name", answerLabel: "Your answer",
    skip: "Skip", confirm: "Confirm", answer: "Answer", next: "Next question", results: "See results",
    again: "Play again", change: "Change settings",
    skipped: "Skipped", correct: "Correct",
    rightCountry: "You coloured in the right country.",
    chose: "You chose {name}, {km} km away.", choseArea: "You chose another area, {km} km away.",
    pinNear: "Your pin is {km} km away, close enough for full points.", pinFar: "Your pin is {km} km away.",
    close: "Close enough: you typed “{typed}”.", typed: "You typed “{typed}”.",
    factCapital: "Capital: {name}.", capitalOf: "Capital of {name}.", about: "About {area}.",
    million: "million km²", river: "About {km} km long, flowing into {mouth}.",
    ranks: ["Uncharted waters", "Coastal pilot", "Ocean navigator", "Master cartographer"],
    quit: "Quit", ended: "Round ended after {n} of {total} questions.",
    musicOn: "♪ On", musicOff: "♪ Off", musicLabel: "Background music", volumeLabel: "Music volume",
    legendRight: "Right", legendChosen: "Wrong choice", legendMissed: "Missed",
    zoomIn: "Zoom in", zoomOut: "Zoom out", home: "Show the whole region", language: "Language", map: "World map",
  },
  de: {
    kinds: { country: "Länder", capital: "Hauptstädte", mountain: "Berge", river: "Flüsse" },
    one: { country: "Land", capital: "Hauptstadt", mountain: "Berg", river: "Fluss" },
    nameThis: { country: "Wie heißt dieses Land?", capital: "Wie heißt diese Hauptstadt?", mountain: "Wie heißt dieser Berg?", river: "Wie heißt dieser Fluss?" },
    regions: { World: "Welt", Africa: "Afrika", Asia: "Asien", Europe: "Europa", "North America": "Nordamerika", "South America": "Südamerika", Oceania: "Ozeanien", Antarctica: "Antarktika" },
    types: { both: "Beides", name: "Benennen", find: "Finden" },
    intro: "Benenne Orte auf einer unbeschrifteten Weltkarte oder finde sie anhand ihres Namens.",
    credit: "Kartendaten: Natural Earth, gemeinfrei. Länder sind die UN-Mitglieder sowie Kosovo, Palästina, Taiwan und die Vatikanstadt. Die Grenzen dienen nur dem Spiel und sind keine politische Aussage.",
    legendAsk: "Was wird gefragt", legendHow: "Wie antworten", legendWhere: "Wo", start: "Runde starten",
    startNote: "{n} Fragen, jeweils bis zu 100 Punkte", startEmpty: "Wähle etwas aus, das es in dieser Region gibt.",
    question: "Frage {i} von {n}", points: "Pkt.", find: "Finde {name}",
    hintPin: "Klicke auf die Karte, um deine Nadel zu setzen. Scrolle oder ziehe mit zwei Fingern zum Zoomen.",
    hintCountry: "Dein Klick auf ein Land ist deine Antwort. Scrolle oder ziehe mit zwei Fingern zum Zoomen.",
    hintSpelling: "Kleine Tippfehler sind kein Problem.", placeholder: "Name eingeben", answerLabel: "Deine Antwort",
    skip: "Überspringen", confirm: "Bestätigen", answer: "Antworten", next: "Nächste Frage", results: "Zum Ergebnis",
    again: "Nochmal spielen", change: "Einstellungen ändern",
    skipped: "Übersprungen", correct: "Richtig",
    rightCountry: "Du hast das richtige Land eingefärbt.",
    chose: "Du hast {name} gewählt, {km} km entfernt.", choseArea: "Du hast ein anderes Gebiet gewählt, {km} km entfernt.",
    pinNear: "Deine Nadel ist {km} km entfernt, nah genug für die volle Punktzahl.", pinFar: "Deine Nadel ist {km} km entfernt.",
    close: "Nah genug: Du hast „{typed}“ eingegeben.", typed: "Du hast „{typed}“ eingegeben.",
    factCapital: "Hauptstadt: {name}.", capitalOf: "Hauptstadt von {name}.", about: "Rund {area}.",
    million: "Mio. km²", river: "Rund {km} km lang, mündet in {mouth}.",
    ranks: ["Unbekannte Gewässer", "Küstengewässer", "Hochseetauglich", "Meisterhafte Kartografie"],
    quit: "Beenden", ended: "Runde nach {n} von {total} Fragen beendet.",
    musicOn: "♪ An", musicOff: "♪ Aus", musicLabel: "Hintergrundmusik", volumeLabel: "Musiklautstärke",
    legendRight: "Richtig", legendChosen: "Falsch gewählt", legendMissed: "Verpasst",
    zoomIn: "Vergrößern", zoomOut: "Verkleinern", home: "Ganze Region zeigen", language: "Sprache", map: "Weltkarte",
  },
};
function storedLanguage() {
  try { const saved = localStorage.getItem("blank-map-lang"); if (STRINGS[saved]) return saved; } catch (e) {}
  return (navigator.language || "").toLowerCase().startsWith("de") ? "de" : "en";
}
let lang = storedLanguage();
const S = () => STRINGS[lang];
const fill = (text, vars = {}) => text.replace(/\{(\w+)\}/g, (_, k) => vars[k]);
const num = n => Math.round(n).toLocaleString(lang);
const label = item => item.names[lang];

/* ---------- Content ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const countriesObject = DATA.world.objects.countries;
const allFeatures = topojson.feature(DATA.world, countriesObject).features;

function countryGeometry(c) {
  if (c.point) return d3.geoCircle().center(c.point).radius(0.12)();
  const names = [c.shape, ...c.extra];
  return topojson.merge(DATA.world, countriesObject.geometries.filter(g => names.includes(g.properties.name)));
}
function areaKm2(geo) { return d3.geoArea(geo) * EARTH_KM * EARTH_KM; }
function roundArea(km2) {
  if (km2 >= 1e6) return `${(km2 / 1e6).toLocaleString(lang, { maximumFractionDigits: 1 })} ${S().million}`;
  return `${num(Math.round(km2 / 1000) * 1000)} km²`;
}
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const sentence = text => text[0].toUpperCase() + text.slice(1);

const ITEMS = [];
for (const c of DATA.countries) {
  const geo = countryGeometry(c);
  const size = Math.sqrt(areaKm2(geo));
  const country = { kind: "country", names: { en: c.name, de: c.de.name }, aliases: [...c.aliases, ...c.de.aliases], region: c.region, geo, size,
    full: 60, zero: clamp(1.2 * size, 300, 1200),
    fact() {
      const parts = [c.capital ? fill(S().factCapital, { name: lang === "de" ? c.capitalDe.name : c.capital }) : "", `${S().regions[c.region]}.`];
      if (size > 100) parts.push(fill(S().about, { area: roundArea(size * size) }));
      return parts.filter(Boolean).join(" ");
    } };
  ITEMS.push(country);
  if (c.capital) ITEMS.push({ kind: "capital", names: { en: c.capital, de: c.capitalDe.name },
    aliases: [...c.capitalAliases, ...c.capitalDe.aliases], region: c.region,
    geo: { type: "Point", coordinates: c.capitalCoord },
    full: 40, zero: clamp(1.5 * size, 400, 2000),
    fact() {

    /* A country answers at once. The sea only counts when looking for a tiny country, which may be too small to hit. */
    const hit = hitAt(ll);
    if (hit || item.size < 100) answerFind({ ll, hit });
    return;
  }
  game.pick = { ll, hit: null };
  markers.selectAll("*").remove();
  addMarker(ll, drawPin);
  const confirm = document.getElementById("confirm");
  confirm.disabled = false;
  confirm.focus({ preventScroll: true });
});
function feedbackText(q) {
  const s = S(), r = q.result, km = num(r.km || 0);
  const name = r.hit && r.hit.item ? label(r.hit.item) : null;
  return {
    skipped: s.skipped + ".",
    right: s.rightCountry,
    chose: name ? fill(s.chose, { name, km }) : fill(s.choseArea, { km }),
    near: fill(s.pinNear, { km }),
    far: fill(s.pinFar, { km }),
    exact: s.correct + ".",
    close: fill(s.close, { typed: r.typed }),
    wrong: fill(s.typed, { typed: r.typed }),
  }[r.type];
}
function shortResult(q) {
  const s = S(), r = q.result;
  if (r.type === "skipped") return s.skipped;
  if (r.type === "right" || r.type === "exact" || r.type === "close") return s.correct;
  if (r.type === "wrong") return lang === "de" ? `„${r.typed}“` : `“${r.typed}”`;
  return `${num(r.km)} km`;
}
function feedbackDock() {
  const s = S();
  const q = game.round[game.index];
  const last = game.index === game.round.length - 1;
  setDock(`<div class="wrap">${statusBar(q)}<div class="prompt">
    <div><h2><span class="verdict ${band(q.points)}">+${q.points}</span>${esc(label(q.item))}</h2>
    <p>${esc(feedbackText(q))} ${esc(q.item.fact())}</p></div>
    <div class="actions"><button class="primary" id="next" type="button">${last ? s.results : s.next}</button></div>
  </div></div>`);
  const next = document.getElementById("next");
  next.onclick = () => { game.index++; last ? renderSummary() : renderQuestion(); };
  next.focus({ preventScroll: true });
}
function finishAnswer(q, points, result) {
  q.points = points; q.result = result;
  game.total += points;
  game.phase = "feedback";
  game.drawDock = feedbackDock;
  svg.classed("placing", false);
  feedbackDock();
  if (points === 100) fireworks();
}
/* A coloured-in neighbour is a wrong country, so it earns less than a hit. Tiny countries stay forgiving,
   because at world zoom the click almost always lands on the country around them. */
function pointsForPick(item, km, hit) {
  if (km === 0) return 100;
  if (!hit || item.size < 100) return pointsFor(item, km);
  return Math.min(80, pointsFor({ full: 0, zero: item.zero }, km));
}
function answerFind(pick) {
  const q = game.round[game.index];
  q.guess = pick ? pick.ll : null;
  q.hit = pick ? pick.hit : null;
  if (!pick) { markGuess(q, 0, null); showReveal(q.item, null, null); return finishAnswer(q, 0, { type: "skipped" }); }
  const { km } = nearest(q.item, pick.ll);
  const isCountry = q.item.kind === "country";
  const points = isCountry ? pointsForPick(q.item, km, pick.hit) : pointsFor(q.item, km);
  markGuess(q, points, pick.hit);
  showReveal(q.item, pick.ll, pick.hit);
  const type = km === 0 ? "right" : pick.hit ? "chose" : km <= q.item.full ? "near" : "far";
  finishAnswer(q, points, { type, km, hit: pick.hit });
}
function answerName(typed) {
  const q = game.round[game.index];
  q.guess = null; q.hit = null;
  const result = typed ? matchAnswer(q.item, typed) : "wrong";
  markGuess(q, result === "wrong" ? 0 : 100, null);
  showReveal(q.item, null, null);
  if (!typed) return finishAnswer(q, 0, { type: "skipped" });
  finishAnswer(q, result === "wrong" ? 0 : 100, { type: result, typed: typed.trim() });
}
function summaryDock() {
  const s = S();
  const answered = game.round.filter(q => q.points != null);
  const max = answered.length * 100, pct = game.total / max;
  const ended = answered.length < game.round.length ? `<p class="ended">${fill(s.ended, { n: answered.length, total: game.round.length })}</p>` : "";
  const rank = s.ranks[pct >= .9 ? 3 : pct >= .7 ? 2 : pct >= .4 ? 1 : 0];
  setDock(`<div class="wrap">
    <div class="summary-head"><h2>${game.total} <small>/ ${max}</small><span class="rank">${rank}</span></h2>
      <div class="actions"><button class="quiet" id="change" type="button">${s.change}</button><button class="primary" id="again" type="button">${s.again}</button></div></div>
    ${ended}<div class="rows">${answered.map((q, i) => `<button type="button" data-i="${i}"><span>${esc(label(q.item))}<em>${esc(shortResult(q))}</em></span><b class="${band(q.points)}">${q.points}</b></button>`).join("")}</div>
  </div>`);
  document.getElementById("again").onclick = startRound;
  document.getElementById("change").onclick = renderSetup;
  dock.querySelectorAll(".rows button").forEach(b => b.onclick = () => {
    dock.querySelectorAll(".rows button").forEach(o => o.classList.toggle("active", o === b));
    const q = answered[+b.dataset.i];
    showReveal(q.item, q.guess, q.hit);
  });
  document.getElementById("again").focus({ preventScroll: true });
}
/* Quitting shows what was answered so far. With nothing answered there is nothing to show. */
function quitRound() {
  if (game.round.some(q => q.points != null)) renderSummary();
  else renderSetup();
}
function renderSummary() {
  music.end();
  activeView = null;
  game.hiddenGuess = null;
  redrawGuessed();
  game.phase = "summary";
  game.index = game.round.length - 1;
  game.drawDock = summaryDock;
  summaryDock();
  showRegion(settings.region);
  clearMarks();
}

/* ---------- Fireworks ---------- */
/* Rockets rise from the bottom of the map and burst around the answer, which the reveal view centres. */
const fireworks = (() => {
  const canvas = document.getElementById("sparks"), pen = canvas.getContext("2d");
  const SHELLS = [[.5, .42, .2], [.28, .3, .55], [.72, .34, .85], [.5, .2, 1.2]];
  const RISE = .5, GRAVITY = 170, DRAG = 1.9;
  let rockets = [], sparks = [], frame = null, last = 0, width = 0, height = 0;
  function burst(r) {
    const speed = 150 * clamp(Math.min(width, height) / 450, .6, 1.5);
    for (let i = 0; i < 56; i++) {
      const angle = Math.random() * Math.PI * 2, v = speed * (.35 + Math.random() * .65);
      const life = .9 + Math.random() * .6;
      sparks.push({ x: r.x, y: r.y, vx: Math.cos(angle) * v, vy: Math.sin(angle) * v, age: 0, life, color: r.color });
    }
  }
  function draw(now) {
    const dt = Math.min((now - last) / 1000, .05);
    last = now;
    pen.clearRect(0, 0, width, height);
    pen.lineCap = "round";
    rockets = rockets.filter(r => {
      r.wait -= dt;
      if (r.wait > 0) return true;
      const t = Math.min(-r.wait / RISE, 1), rise = 1 - Math.pow(1 - t, 2);
      const y = height + (r.y - height) * rise;
      pen.globalAlpha = 1;
      pen.strokeStyle = r.color;
      pen.lineWidth = 2.5;
      pen.beginPath();
      pen.moveTo(r.x, y);
      pen.lineTo(r.x, y + 14);
      pen.stroke();
      if (t < 1) return true;
      burst(r);
      return false;
    });
    pen.lineWidth = 2.2;
    sparks = sparks.filter(p => {
      p.age += dt;
      if (p.age >= p.life) return false;
      const x = p.x, y = p.y, slow = Math.exp(-DRAG * dt);
      p.vx *= slow;
      p.vy = p.vy * slow + GRAVITY * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      pen.globalAlpha = 1 - Math.pow(p.age / p.life, 2);
      pen.strokeStyle = p.color;
      pen.beginPath();
      pen.moveTo(x - p.vx * .03, y - p.vy * .03);
      pen.lineTo(p.x, p.y);
      pen.stroke();
      return true;
    });
    pen.globalAlpha = 1;
    frame = rockets.length || sparks.length ? requestAnimationFrame(draw) : null;
    if (!frame) pen.clearRect(0, 0, width, height);
  }
  return () => {
    if (reduceMotion) return;
    const box = canvas.getBoundingClientRect(), ratio = window.devicePixelRatio || 1;
    width = box.width; height = box.height;
    canvas.width = Math.round(width * ratio);
    canvas.height = Math.round(height * ratio);
    pen.setTransform(ratio, 0, 0, ratio, 0, 0);
    const style = getComputedStyle(document.documentElement);
    const colors = d3.shuffle(["--mark", "--pick", "--good", "--ok"].map(name => style.getPropertyValue(name).trim()));
    rockets = SHELLS.map(([x, y, wait], i) => ({ x: x * width, y: y * height, wait, color: colors[i] }));
    sparks = [];
    if (!frame) { last = performance.now(); frame = requestAnimationFrame(draw); }
  };
})();

/* ---------- Music ---------- */
/* An original looping score in D minor, synthesised live so the page ships no audio files. */
const music = (() => {
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  const STEP = 60 / 76 / 2; /* one eighth note at 76 bpm */
  /* Each chord: the bass note, then the three notes the strings hold for the bar. */
  const DM = [38, 62, 65, 69], BB = [34, 62, 65, 70], F = [41, 60, 65, 69], C = [36, 60, 64, 67], GM = [43, 62, 67, 70], A = [33, 61, 64, 69];
  const BARS = [DM, BB, F, C, DM, BB, GM, A];
  const OSTINATO = [0, 0, 12, 0, 7, 0, 12, 7];
  /* The horn theme as [note, length in eighths], eight bars of eight. */
  const THEME = [
    [62, 3], [69, 1], [69, 4],   [70, 3], [69, 1], [65, 4],
    [65, 3], [69, 1], [72, 4],   [72, 3], [70, 1], [67, 4],
    [69, 3], [74, 1], [74, 4],   [77, 3], [74, 1], [70, 4],
    [70, 3], [72, 1], [74, 2], [70, 2],   [69, 4], [73, 2], [69, 2],
  ];
  const MELODY = [];
  THEME.reduce((at, [midi, length]) => { MELODY[at] = { midi, length }; return at + length; }, 0);

  /* Strings and horns go through their own filter into a shared hall reverb. */
  function buildMix(ctx, output) {
    const limiter = ctx.createDynamicsCompressor();
    limiter.threshold.value = -14;
    limiter.ratio.value = 6;
    limiter.connect(output);
    const hall = ctx.createConvolver();
    const impulse = ctx.createBuffer(2, Math.floor(ctx.sampleRate * 2.6), ctx.sampleRate);
    for (const channel of [0, 1]) impulse.getChannelData(channel).forEach((_, i, data) => {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 3);
    });
    hall.buffer = impulse;
    const wet = ctx.createGain();
    wet.gain.value = .3;
    hall.connect(wet).connect(limiter);
    const bus = cutoff => {
      const filter = ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = cutoff;
      filter.connect(limiter);
      filter.connect(hall);
      return filter;
    };
    const noise = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 2), ctx.sampleRate);
    noise.getChannelData(0).forEach((_, i, data) => { data[i] = Math.random() * 2 - 1; });
    return { ctx, strings: bus(1100), horns: bus(1900), drums: bus(7000), noise };
  }
  function note(ctx, dest, midi, time, type, attack, length, volume, detune = 0) {
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = 440 * Math.pow(2, (midi - 69) / 12);
    osc.detune.value = detune;
    gain.gain.setValueAtTime(0, time);
    gain.gain.linearRampToValueAtTime(volume, time + attack);
    gain.gain.linearRampToValueAtTime(volume * .75, time + length * .75);
    gain.gain.exponentialRampToValueAtTime(.0005, time + length);
    osc.connect(gain).connect(dest);
    osc.start(time);
    osc.stop(time + length + .02);
  }
  function noiseHit(mix, time, filterType, cutoff, length, volume) {
    const { ctx } = mix;
    const source = ctx.createBufferSource(), filter = ctx.createBiquadFilter(), gain = ctx.createGain();
    source.buffer = mix.noise;
    filter.type = filterType;
    filter.frequency.value = cutoff;
    gain.gain.setValueAtTime(volume, time);
    gain.gain.exponentialRampToValueAtTime(.0005, time + length);
    source.connect(filter).connect(gain).connect(mix.drums);
    source.start(time);
    source.stop(time + length + .02);
  }
  function timpani(mix, time, volume) {
    const { ctx } = mix;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(110, time);
    osc.frequency.exponentialRampToValueAtTime(58, time + .16);
    gain.gain.setValueAtTime(volume, time);
    gain.gain.exponentialRampToValueAtTime(.0005, time + .95);
    osc.connect(gain).connect(mix.drums);
    osc.start(time);
    osc.stop(time + 1);
    noiseHit(mix, time, "lowpass", 500, .12, volume * .45);
  }
  /* Three passes of the eight bars: strings and drums, then the horns enter, then the horns double at the octave. */
  function playStep(mix, n, time) {
    const { ctx } = mix;
    const s = n % 64, pass = Math.floor(n / 64) % 3, inBar = s % 8, bar = Math.floor(s / 8);
    const chord = BARS[bar], full = pass > 0;
    if (inBar === 0) {
      for (const midi of chord.slice(1)) {
        note(ctx, mix.strings, midi, time, "sawtooth", .5, STEP * 8.4, .04, -7);
        note(ctx, mix.strings, midi, time, "sawtooth", .5, STEP * 8.4, .04, 7);
      }
      note(ctx, mix.strings, chord[0], time, "sawtooth", .15, STEP * 8, .14);
      if (full && s === 0) noiseHit(mix, time, "highpass", 3500, 1.9, .1);
    }
    note(ctx, mix.strings, chord[0] + 12 + OSTINATO[inBar], time, "sawtooth", .008, STEP * .8, full ? .085 : .055);
    if (inBar === 0 || inBar === 4) timpani(mix, time, full ? .55 : .36);
    if (full && inBar === 3) timpani(mix, time, .3);
    if (full && bar % 4 === 3 && inBar >= 6) {
      timpani(mix, time, .3);
      timpani(mix, time + STEP / 2, .36);
    }
    const line = full && MELODY[s];
    if (line) {
      const length = STEP * line.length * .96;
      note(ctx, mix.horns, line.midi, time, "sawtooth", .06, length, .085, -5);
      note(ctx, mix.horns, line.midi, time, "sawtooth", .06, length, .085, 5);
      if (pass === 2) note(ctx, mix.horns, line.midi + 12, time, "sawtooth", .06, length, .055);
    }
  }
  let on = true, wanted = false, ctx = null, master = null, mix = null, timer = null, step = 0, nextTime = 0;
  let volume = .8;
  try {
    on = localStorage.getItem("blank-map-music") !== "off";
    const saved = localStorage.getItem("blank-map-volume");
    if (saved !== null && +saved >= 0 && +saved <= 1) volume = +saved;
  } catch (e) {}
  function tick() {
    while (nextTime < ctx.currentTime + .3) {
      playStep(mix, step++, nextTime);
      nextTime += STEP;
    }
  }
  function play() {
    if (!AudioCtx) return;
    if (!ctx) {
      ctx = new AudioCtx();
      master = ctx.createGain();
      master.gain.value = 0;
      master.connect(ctx.destination);
      mix = buildMix(ctx, master);
    }
    ctx.resume();
    master.gain.setTargetAtTime(volume, ctx.currentTime, .15);
    if (timer) return;
    nextTime = ctx.currentTime + .08;
    timer = setInterval(tick, 100);
    tick();
  }
  function pause() {
    if (!ctx || !timer) return;
    clearInterval(timer);
    timer = null;
    master.gain.setTargetAtTime(0, ctx.currentTime, .05);
    setTimeout(() => { if (!timer) ctx.suspend(); }, 300);
  }
  function drawButton() {
    const button = document.getElementById("music");
    button.hidden = !AudioCtx;
    button.textContent = on ? S().musicOn : S().musicOff;
    button.setAttribute("aria-pressed", String(on));
    button.setAttribute("aria-label", S().musicLabel);
    button.title = S().musicLabel;
    const box = document.getElementById("volume-box"), slider = document.getElementById("volume");
    box.hidden = !AudioCtx;
    box.classList.toggle("off", !on);
    box.title = S().volumeLabel;
    slider.setAttribute("aria-label", S().volumeLabel);
    slider.value = Math.round(volume * 100);
  }
  document.getElementById("music").onclick = () => {
    on = !on;
    wanted = on;
    try { localStorage.setItem("blank-map-music", on ? "on" : "off"); } catch (e) {}
    if (on) play(); else pause();
    drawButton();
  };
  document.getElementById("volume").oninput = e => {
    volume = e.target.value / 100;
    try { localStorage.setItem("blank-map-volume", String(volume)); } catch (err) {}
    if (timer) master.gain.setTargetAtTime(volume, ctx.currentTime, .03);
  };
  /* Browsers throttle timers in hidden tabs, which would make the tune stumble. */
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) pause();
    else if (wanted && on) play();
  });
  return {
    begin() { wanted = true; if (on) play(); },
    end() { wanted = false; pause(); },
    drawButton, buildMix, playStep, stepLength: STEP,
    get level() { return master ? master.gain.value : null; },
    get playing() { return !!timer && !!ctx && ctx.state === "running"; },
  };
})();

/* ---------- Language switch ---------- */
function applyLanguage() {
  const s = S();
  document.documentElement.lang = lang;
  document.getElementById("zoom-in").setAttribute("aria-label", s.zoomIn);
  document.getElementById("zoom-out").setAttribute("aria-label", s.zoomOut);
  const home = document.getElementById("zoom-home");
  home.setAttribute("aria-label", s.home);
  home.title = s.home;
  document.getElementById("lang").setAttribute("aria-label", s.language);
  music.drawButton();
  redrawGuessed();
  document.getElementById("map").setAttribute("aria-label", s.map);
  document.querySelectorAll("#lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
}
document.querySelectorAll("#lang button").forEach(b => b.onclick = () => {
  if (b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  try { localStorage.setItem("blank-map-lang", lang); } catch (e) {}
  applyLanguage();
  game.drawDock();
});

window.blankMap = { ITEMS, matchAnswer, nearest, pointsFor, pointsForPick, hitAt, normalize, pickRound, game, projection, svg, music, fireworks };
applyLanguage();
layout();
renderSetup();
window.addEventListener("resize", refit);
</script>
