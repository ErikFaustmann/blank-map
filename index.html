<style>
/* Layout: a full-bleed nautical chart with a docked title block below it. The palette follows
   chart conventions: buff land, tinted water, magenta for marked positions. Dark is night mode. */
:root {
  --sea: #cfe4ee; --land: #f1e4b8; --coast: #5f6c60; --border: #4f4733; --grid: #a9c6d4;
  --panel: #f7fafa; --panel-2: #e8f0f2; --ink: #12303e; --muted: #4d6673; --line: #bfd0d6;
  --mark: #b0117a; --mark-ink: #ffffff; --pin: #12303e; --pick: #1769aa;
  --good: #1c7a4c; --ok: #a96a00; --bad: #bd3b1e; --river: #9fc6dc; --peak: #8c6a3f;
  --display: "Barlow Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --sea: #0a1a26; --land: #38392a; --coast: #8d9885; --border: #c4c6a8; --grid: #1c3444;
  --panel: #0f222e; --panel-2: #173140; --ink: #dfeaee; --muted: #9db3bd; --line: #2a4453;
  --mark: #f472c8; --mark-ink: #2a0a20; --pin: #ffffff; --pick: #58b4f0;
  --good: #5fce96; --ok: #e6ad4d; --bad: #f08a6c; --river: #2f5a75; --peak: #b49a76; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --sea: #0a1a26; --land: #38392a; --coast: #8d9885; --border: #c4c6a8; --grid: #1c3444;
  --panel: #0f222e; --panel-2: #173140; --ink: #dfeaee; --muted: #9db3bd; --line: #2a4453;
  --mark: #f472c8; --mark-ink: #2a0a20; --pin: #ffffff; --pick: #58b4f0;
  --good: #5fce96; --ok: #e6ad4d; --bad: #f08a6c; --river: #2f5a75; --peak: #b49a76; color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body { background: var(--sea); color: var(--ink); font: 15px/1.45 var(--body); overflow: hidden; }
* { box-sizing: border-box; }
#app { height: 100%; display: grid; grid-template-rows: minmax(0, 1fr) auto; }

#stage { position: relative; min-height: 0; overflow: hidden; background: var(--sea); }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#map.placing { cursor: crosshair; }
#map:active { cursor: grabbing; }
#map.middle { background: var(--panel-2); }
#map path { vector-effect: non-scaling-stroke; }
.sphere { fill: var(--sea); stroke: var(--grid); stroke-width: 1; }
.graticule { fill: none; stroke: var(--grid); stroke-width: .6; }
.land { fill: var(--land); stroke: var(--coast); stroke-width: .8; }
.borders { fill: none; stroke: var(--border); stroke-width: 1; stroke-linejoin: round; }
#map .relief-rivers { fill: none; stroke: var(--river); stroke-width: .7; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
#map .relief-peak { pointer-events: none; }
#map .relief-peak path { fill: var(--peak); stroke: var(--land); stroke-width: .6; stroke-linejoin: round; }
#map .relief-peak .snow, .m-peak-snow { fill: #f3f0e8; stroke: none; }
#map .lakes { fill: var(--sea); stroke: var(--coast); stroke-width: .6; }
#map .hl-water { fill: var(--mark); fill-opacity: .4; stroke: var(--mark); stroke-width: 1.6; }
/* Rivers have a wide invisible band around them, so they are easy to point at. */
#map .river-hit { fill: none; stroke: transparent; stroke-width: 12; stroke-linecap: round; pointer-events: stroke; }
#map .river-glow { fill: none; stroke: var(--pick); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.map-label { pointer-events: none; }
.map-label text { font: 600 14px var(--display); letter-spacing: .02em; text-anchor: middle; fill: var(--ink); stroke: var(--panel); stroke-width: 3.5px; stroke-linejoin: round; paint-order: stroke; }
.map-label circle { fill: var(--ink); stroke: var(--panel); stroke-width: 1.5; }
#map .hl-area { fill: var(--mark); fill-opacity: .62; stroke: var(--mark); stroke-width: 1.4; }
#map .hl-river { fill: none; stroke: var(--mark); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
#map .hl-river-halo { fill: none; stroke: var(--panel); stroke-width: 6; stroke-opacity: .75; stroke-linecap: round; stroke-linejoin: round; }
#map .hl-right { fill: var(--good); fill-opacity: .7; stroke: var(--good); stroke-width: 1.4; }
#map .hl-chosen { fill: var(--bad); fill-opacity: .6; stroke: var(--bad); stroke-width: 1.4; }
#map .sel-hover { fill: var(--pick); fill-opacity: .25; stroke: var(--pick); stroke-width: 1; pointer-events: none; }
#map .gap { fill: none; stroke: var(--pin); stroke-width: 1.6; stroke-dasharray: 5 5; }
#sparks { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.m-dot { fill: var(--mark); stroke: var(--panel); stroke-width: 2; }
.m-ring { fill: none; stroke: var(--mark); stroke-width: 2.5; }
.m-peak { fill: var(--mark); stroke: var(--panel); stroke-width: 2; stroke-linejoin: round; }
.m-pin { fill: none; stroke: var(--pin); stroke-width: 2.5; }
.m-pin-c { fill: var(--pin); }
.m-pin-halo { fill: none; stroke: var(--panel); stroke-width: 5; stroke-opacity: .7; }

#zoomctl { position: absolute; display: grid; gap: 6px;
  top: calc(12px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); }
#zoomctl button { width: 38px; height: 38px; padding: 0; font: 600 20px/1 var(--body); }
#topbar { position: absolute; display: flex; flex-wrap: wrap; gap: 8px; max-width: calc(100% - 74px);
  top: calc(12px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); }
#account { order: 3; height: 38px; max-width: 170px; padding: 0 12px; font: 600 15px/1 var(--display); letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#account[hidden] { display: none; }
#lang { display: flex; }
#music, #effects { order: 1; height: 38px; padding: 0 12px; font: 600 15px/1 var(--display); letter-spacing: .04em; white-space: nowrap; }
#music[aria-pressed="false"], #effects[aria-pressed="false"] { color: var(--muted); border-color: var(--line); }
#volume-box { order: 2; display: flex; align-items: center; height: 38px; padding: 0 10px; background: var(--panel); border: 1px solid var(--ink); border-radius: 3px; }
#volume-box[hidden] { display: none; }
#volume-box.off { border-color: var(--line); }
#volume { width: 84px; margin: 0; accent-color: var(--mark); cursor: pointer; }
#legend { position: absolute; bottom: 8px; right: max(12px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 3px 10px;
  padding: 4px 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 3px; font-size: 12px; pointer-events: none; }
#legend[hidden] { display: none; }
#legend span { display: flex; align-items: center; gap: 5px; }
#legend i { width: 10px; height: 10px; }
#legend .hl-right { background: var(--good); } #legend .hl-chosen { background: var(--bad); } #legend .hl-area { background: var(--mark); }
.status-end { display: flex; align-items: center; gap: 12px; }
#quit { padding: 4px 10px; font-size: 13px; }
.ended { margin: 0; color: var(--muted); }
#lang button { min-width: 42px; height: 38px; padding: 0 10px; font: 600 15px/1 var(--display); letter-spacing: .06em; }
#lang button:first-child { border-radius: 3px 0 0 3px; }
#lang button:last-child { border-radius: 0 3px 3px 0; margin-left: -1px; }
#lang button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
#readout { position: absolute; bottom: 8px; left: max(12px, env(safe-area-inset-left, 0px));
  font: 12px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; pointer-events: none; }
@media (hover: none) { #readout { display: none; } }

#dock { background: var(--panel); border-top: 2px solid var(--ink); max-height: 66vh; overflow-y: auto;
  padding-block: 14px calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1120px; margin-inline: auto; display: grid; gap: 10px; }

button { font: 500 14px/1.2 var(--body); color: var(--ink); background: var(--panel); border: 1px solid var(--ink);
  border-radius: 3px; padding: 9px 14px; cursor: pointer; }
button:hover:not(:disabled) { background: var(--panel-2); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--mark); border-color: var(--mark); color: var(--mark-ink); font-weight: 600; }
button.primary:hover:not(:disabled) { background: var(--mark); filter: brightness(1.1); }
button.quiet { border-color: var(--line); color: var(--muted); }
:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }

/* Setup */
.setup { grid-template-columns: minmax(180px, 250px) minmax(0, 1fr); gap: 14px 32px; }
.brand h1 { font: 700 44px/.95 var(--display); margin: 0 0 6px; letter-spacing: .005em; text-transform: uppercase; }
.brand p { margin: 0 0 12px; color: var(--muted); }
.brand small { display: block; color: var(--muted); font-size: 12px; line-height: 1.4; }
.options { display: grid; gap: 10px; min-width: 0; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { padding: 0; margin-bottom: 5px; font: 600 15px/1.2 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; margin: 0; width: 100%; height: 100%; cursor: pointer; }
.chip span { display: block; padding: 7px 12px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); }
.chip span i { font: 12px var(--mono); font-style: normal; color: var(--muted); margin-left: 5px; }
.chip input:checked + span { background: var(--ink); border-color: var(--ink); color: var(--panel); font-weight: 500; }
.chip input:checked + span i { color: inherit; }
.chip input:focus-visible + span { outline: 3px solid var(--mark); outline-offset: 2px; }
.start { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.start button { padding: 11px 28px; font-size: 16px; }
.start span { color: var(--muted); }

/* In play */
.status { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 16px; }
.eyebrow { font: 600 15px/1.2 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.total { font: 500 13px var(--mono); font-variant-numeric: tabular-nums; }
.tally { display: flex; gap: 3px; list-style: none; margin: 0; padding: 0; }
.tally li { width: 20px; height: 6px; background: var(--panel-2); }
.tally li.now { background: var(--ink); }
.tally li.good { background: var(--good); } .tally li.ok { background: var(--ok); } .tally li.bad { background: var(--bad); }
.prompt { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px; }
.prompt > div:first-child { min-width: 0; flex: 1 1 300px; }
.prompt h2 { font: 600 34px/1.05 var(--display); margin: 0; text-wrap: balance; }
.prompt p { margin: 3px 0 0; color: var(--muted); }
.prompt h2 .target { color: var(--mark); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.answer-form { display: flex; flex-wrap: wrap; gap: 8px; flex: 1 1 340px; max-width: 560px; }
.answer-form input { flex: 1 1 180px; min-width: 0; padding: 9px 12px; font: 500 16px var(--body); color: var(--ink);
  background: var(--panel); border: 1px solid var(--ink); border-radius: 3px; }
.verdict { display: inline-block; font: 600 13px/1 var(--mono); padding: 4px 7px; border-radius: 2px; color: var(--panel); margin-right: 8px; vertical-align: 4px; font-variant-numeric: tabular-nums; }
.verdict.good { background: var(--good); } .verdict.ok { background: var(--ok); } .verdict.bad { background: var(--bad); }

.fact-name { padding: 0; font: inherit; color: inherit; background: none; border: 0; border-bottom: 2px dotted var(--mark); border-radius: 0; cursor: help; }
.fact-name:hover:not(:disabled) { background: none; color: var(--mark); }
.rows button[data-facts] { cursor: help; }
#fact-pop { position: fixed; z-index: 5; width: min(540px, calc(100vw - 32px)); overflow-y: auto; padding: 10px 14px; background: var(--panel); border: 2px solid var(--ink); border-radius: 3px; pointer-events: none; }
#fact-pop[hidden] { display: none; }
#fact-pop h3 { margin: 0 0 4px; font: 600 20px/1.1 var(--display); }
#fact-pop ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }
.fact-photo { margin: 0 0 8px; }
.fact-frame { position: relative; }
.fact-frame .fact-shot { display: block; width: 100%; height: auto; max-height: min(330px, 45vh); object-fit: cover; background: var(--panel-2); border: 1px solid var(--line); }
/* The flag sits in the photo's corner, framed so it stands out on any background. */
.fact-flag { position: absolute; left: 10px; bottom: 10px; height: 46px; width: auto; border: 2px solid var(--panel); background: var(--panel); box-shadow: 0 1px 6px rgba(0, 0, 0, .45); }
.fact-flag.solo { position: static; display: block; margin-bottom: 8px; border-color: var(--line); box-shadow: none; }
.fact-photo figcaption { margin-top: 3px; font-size: 11px; line-height: 1.3; color: var(--muted); }
/* Middle-earth vignettes, drawn in the map's own colours so they follow light and dark mode. */
.fact-art { display: block; width: 100%; height: auto; margin: 0 0 8px; background: var(--sea); border: 1px solid var(--line); }
.fact-art * { stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.fact-art .g { fill: var(--land); } .fact-art .d { fill: var(--panel-2); } .fact-art .s { fill: var(--panel); }
.fact-art .k { fill: #0b1a22; } .fact-art .w { fill: var(--river); } .fact-art .r { fill: var(--bad); }
.fact-art .y { fill: var(--ok); } .fact-art .t { fill: var(--good); } .fact-art .n { fill: none; }

.flag-q { display: block; height: 84px; width: auto; margin-bottom: 8px; border: 1px solid var(--line); }
/* A sight's photo is its question, so it gets room to be recognised. */
.sight-q { margin: 0 0 8px; }
.sight-q img { display: block; height: 180px; max-width: 100%; width: auto; object-fit: cover; border: 1px solid var(--line); background: var(--panel-2); }
.sight-q figcaption { margin-top: 3px; font-size: 11px; color: var(--muted); }
.m-sight { fill: var(--mark); stroke: var(--panel); stroke-width: 1.5; stroke-linejoin: round; }
.map-label .label-sight { fill: var(--ink); stroke: var(--panel); stroke-width: 1.2; stroke-linejoin: round; }
.flag-small { height: 24px; width: auto; margin-right: 8px; vertical-align: -3px; border: 1px solid var(--line); }

/* Login and profile */
.account-form { display: grid; gap: 10px; max-width: 420px; }
.account-form label { display: grid; gap: 4px; font-weight: 500; }
.account-form input { padding: 9px 12px; font: 500 16px var(--body); color: var(--ink); background: var(--panel); border: 1px solid var(--ink); border-radius: 3px; }
.account-error { margin: 0; color: var(--bad); font-weight: 500; }
.account-error:empty { display: none; }
.account-note { margin: 0; color: var(--muted); font-size: 13px; }
.account-ok { margin: 0; color: var(--good); font-weight: 500; }
.account-ok:empty { display: none; }
.account-form label small { font-weight: 400; color: var(--muted); }
.link-button { justify-self: start; padding: 0; border: 0; background: none; color: var(--pick); font-size: 14px; text-decoration: underline; }
.link-button:hover:not(:disabled) { background: none; }
.email-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin: 0; color: var(--muted); font-size: 14px; }
.profile-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px; }
.profile-head h2 { font: 700 40px/1 var(--display); margin: 0; overflow-wrap: anywhere; }
.profile-head h2 small { display: block; margin-top: 4px; font: 500 16px/1.2 var(--body); color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 14px 32px; }
.world-head { margin: 4px 0 0; font: 600 22px/1.1 var(--display); }
.stats h3, .log-head { margin: 0 0 6px; font: 600 15px/1.2 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stat { display: grid; grid-template-columns: 110px minmax(40px, 1fr) 44px; gap: 10px; align-items: center; padding: 4px 0; }
.stat-track { height: 8px; background: var(--panel-2); border-radius: 0 4px 4px 0; }
.stat-track i { display: block; height: 100%; min-width: 2px; background: var(--pick); border-radius: 0 4px 4px 0; }
.stat b { font: 500 13px var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
.stat.unplayed { color: var(--muted); }
.log { list-style: none; margin: 0; padding: 0; }
.log li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 16px; padding: 6px 2px; border-bottom: 1px solid var(--line); }
.log b { font: 500 13px var(--mono); font-variant-numeric: tabular-nums; }
.save-note { flex-basis: 100%; font-size: 13px; }
.unsaved { margin: 0; color: var(--bad); font-weight: 500; }

/* Round summary */
.summary-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px; }
.summary-head h2 { font: 700 40px/1 var(--display); margin: 0; font-variant-numeric: tabular-nums; }
.summary-head h2 small { font: 500 24px var(--display); color: var(--muted); }
.rank { font: 600 20px var(--display); color: var(--mark); margin-left: 12px; }
.rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 0 28px; }
.rows button { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: baseline; width: 100%; text-align: left;
  background: none; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 7px 2px; }
.rows button em { font-style: normal; color: var(--muted); font-size: 13px; margin-left: 6px; }
.rows button b { font: 500 13px var(--mono); font-variant-numeric: tabular-nums; }
.rows button b.good { color: var(--good); } .rows button b.ok { color: var(--ok); } .rows button b.bad { color: var(--bad); }
.rows button.active { background: var(--panel-2); }

@media (max-width: 720px) {
  .setup { grid-template-columns: minmax(0, 1fr); }
  .brand h1 { font-size: 36px; }
  .brand small { display: none; }
  .brand p { margin-bottom: 0; }
  .prompt h2 { font-size: 28px; }
  .flag-q { height: 60px; }
  .sight-q img { height: 130px; }
  .tally li { width: 14px; }
  #dock { max-height: 72vh; }
}
</style>

<div id="app">
  <div id="stage">
    <svg id="map" role="application" aria-label="World map"></svg>
    <canvas id="sparks" aria-hidden="true"></canvas>
    <div id="topbar">
    <button id="music" type="button"></button>
    <button id="effects" type="button"></button>
    <label id="volume-box"><input id="volume" type="range" min="0" max="100" step="1"></label>
    <div id="lang" role="group">
      <button type="button" data-lang="de">DE</button>
      <button type="button" data-lang="en">EN</button>
    </div>
    <button id="account" type="button" hidden></button>
    </div>
    <div id="legend" hidden></div>
    <div id="zoomctl">
      <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
      <button id="zoom-out" type="button" aria-label="Zoom out">&minus;</button>
      <button id="zoom-home" type="button" aria-label="Show the whole region" title="Show the whole region">&#8982;</button>
    </div>
    <div id="readout" aria-hidden="true"></div>
  </div>
  <section id="dock" aria-live="polite"></section>
  <div id="fact-pop" role="tooltip" hidden></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="data.js"></script>
<script src="facts.js"></script>
<script src="quiz.js"></script>
<script src="middleearth.js"></script>
<script src="usa.js"></script>
<script src="water.js"></script>
<script src="sights.js"></script>
<script src="images.js"></script>
<script>
"use strict";
const DATA = window.BLANK_MAP_DATA;
const EARTH_KM = 6371;
const ROUND_LENGTH = 15;

/* ---------- Fireworks ---------- */
/* Rockets rise from the bottom of the map and burst around the answer, which the reveal view centres. */
const fireworks = (() => {
  const canvas = document.getElementById("sparks"), pen = canvas.getContext("2d");
  const SHELLS = [[.5, .42, .2], [.28, .3, .55], [.72, .34, .85], [.5, .2, 1.2]];
  const RISE = .5, GRAVITY = 170, DRAG = 1.9;
  let rockets = [], sparks = [], frame = null, last = 0, width = 0, height = 0;
  function burst(r) {
    const speed = 150 * clamp(Math.min(width, height) / 450, .6, 1.5);
    for (let i = 0; i < 56; i++) {
      const angle = Math.random() * Math.PI * 2, v = speed * (.35 + Math.random() * .65);
      const life = .9 + Math.random() * .6;
      sparks.push({ x: r.x, y: r.y, vx: Math.cos(angle) * v, vy: Math.sin(angle) * v, age: 0, life, color: r.color });
    }
  }
  function draw(now) {
    const dt = Math.min((now - last) / 1000, .05);
    last = now;
    pen.clearRect(0, 0, width, height);
    pen.lineCap = "round";
    rockets = rockets.filter(r => {
      r.wait -= dt;
      if (r.wait > 0) return true;
      const t = Math.min(-r.wait / RISE, 1), rise = 1 - Math.pow(1 - t, 2);
      const y = height + (r.y - height) * rise;
      pen.globalAlpha = 1;
      pen.strokeStyle = r.color;
      pen.lineWidth = 2.5;
      pen.beginPath();
      pen.moveTo(r.x, y);
      pen.lineTo(r.x, y + 14);
      pen.stroke();
      if (t < 1) return true;
      burst(r);
      return false;
    });
    pen.lineWidth = 2.2;
    sparks = sparks.filter(p => {
      p.age += dt;
      if (p.age >= p.life) return false;
      const x = p.x, y = p.y, slow = Math.exp(-DRAG * dt);
      p.vx *= slow;
      p.vy = p.vy * slow + GRAVITY * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      pen.globalAlpha = 1 - Math.pow(p.age / p.life, 2);
      pen.strokeStyle = p.color;
      pen.beginPath();
      pen.moveTo(x - p.vx * .03, y - p.vy * .03);
      pen.lineTo(p.x, p.y);
      pen.stroke();
      return true;
    });
    pen.globalAlpha = 1;
    frame = rockets.length || sparks.length ? requestAnimationFrame(draw) : null;
    if (!frame) pen.clearRect(0, 0, width, height);
  }
  return () => {
    if (reduceMotion) return;
    const box = canvas.getBoundingClientRect(), ratio = window.devicePixelRatio || 1;
    width = box.width; height = box.height;
    canvas.width = Math.round(width * ratio);
    canvas.height = Math.round(height * ratio);
    pen.setTransform(ratio, 0, 0, ratio, 0, 0);
    const style = getComputedStyle(document.documentElement);
    const colors = d3.shuffle(["--mark", "--pick", "--good", "--ok"].map(name => style.getPropertyValue(name).trim()));
    rockets = SHELLS.map(([x, y, wait], i) => ({ x: x * width, y: y * height, wait, color: colors[i] }));
    sparks = [];
    if (!frame) { last = performance.now(); frame = requestAnimationFrame(draw); }
  };
})();

/* ---------- Music ---------- */
/* Original looping tunes, one per region, synthesised live so the page ships no audio files. */

    [65, 3], [69, 1], [72, 4],   [72, 3], [70, 1], [67, 4],
    [69, 3], [74, 1], [74, 4],   [77, 3], [74, 1], [70, 4],
    [70, 3], [72, 1], [74, 2], [70, 2],   [69, 4], [73, 2], [69, 2],

    const impulse = ctx.createBuffer(2, Math.floor(ctx.sampleRate * 2.6), ctx.sampleRate);
    for (const channel of [0, 1]) impulse.getChannelData(channel).forEach((_, i, data) => {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 3);
    });

    const wet = ctx.createGain();
    wet.gain.value = .3;
    hall.connect(wet).connect(limiter);

      const filter = ctx.createBiquadFilter();

      filter.frequency.value = cutoff;
      filter.connect(limiter);

    filter.type = "lowpass";
    filter.frequency.value = 650;

      <label>${s.emailLabel} <small>(${s.emailOptional})</small><input id="login-email" name="email" type="email" autocomplete="email" maxlength="254" spellcheck="false"></label>
      <p class="account-error" role="alert">${account.error ? errorText(account.error) : ""}</p>
      <div class="actions"><button class="primary" id="login-submit" type="submit">${s.login}</button><button class="quiet" id="register-submit" type="submit" value="register">${s.register}</button></div>
      ${account.mail ? `<button class="link-button" id="forgot" type="button">${s.forgot}</button>` : ""}
      <p class="account-note">${s.passwordNote}</p>
    </form></div>`);
  restore(typed);
  document.getElementById("account-back").onclick = account.back;
  if (account.mail) document.getElementById("forgot").onclick = () => openView(forgotDock);
  document.getElementById("login-form").addEventListener("submit", e => {
    e.preventDefault();
    logIn(e.submitter && e.submitter.value === "register" ? "register" : "login");
  });
  document.getElementById(typed["login-name"] ? "login-password" : "login-name").focus({ preventScroll: true });
}
function forgotDock() {
  const s = S();
  const typed = keep(["forgot-email"]);
  setDock(`<div class="wrap">
    <div class="profile-head"><h2>${s.forgotTitle}</h2><div class="actions"><button class="quiet" id="account-back" type="button">${s.back}</button></div></div>
    <p class="account-note">${s.forgotIntro}</p>
    <form class="account-form" id="forgot-form">
      <label>${s.emailLabel}<input id="forgot-email" type="email" autocomplete="email" maxlength="254" spellcheck="false" required></label>
      <p class="account-error" role="alert">${account.error ? errorText(account.error) : ""}</p>
      <p class="account-ok" role="status">${account.note ? s.linkSent : ""}</p>
      <div class="actions"><button class="primary" type="submit">${s.sendLink}</button></div>
    </form></div>`);
  restore(typed);
  document.getElementById("account-back").onclick = openLogin;
  document.getElementById("forgot-form").addEventListener("submit", async e => {
    e.preventDefault();
    try {
      const { ok, data } = await api("forgot", { email: document.getElementById("forgot-email").value, lang });
      account.error = ok ? "" : data.error;
      account.note = ok ? "sent" : "";
    } catch (err) {
      account.error = "network";
    }
    forgotDock();
  });
  document.getElementById("forgot-email").focus({ preventScroll: true });
}
function resetDock() {
  const s = S();
  setDock(`<div class="wrap">
    <div class="profile-head"><h2>${s.resetTitle}</h2><div class="actions"><button class="quiet" id="account-back" type="button">${s.back}</button></div></div>
    <form class="account-form" id="reset-form">
      <label>${s.newPassword}<input id="reset-password" type="password" autocomplete="new-password" maxlength="200" minlength="6" required></label>
      <p class="account-error" role="alert">${account.error ? errorText(account.error) : ""}</p>
      <div class="actions"><button class="primary" type="submit">${s.savePassword}</button>${account.error === "token" && account.mail ? `<button class="link-button" id="forgot" type="button">${s.forgot}</button>` : ""}</div>
    </form></div>`);
  document.getElementById("account-back").onclick = () => { account.resetToken = null; account.back(); };
  if (document.getElementById("forgot")) document.getElementById("forgot").onclick = () => openView(forgotDock);
  document.getElementById("reset-form").addEventListener("submit", async e => {
    e.preventDefault();
    try {
      const { ok, data } = await api("reset", { token: account.resetToken, password: document.getElementById("reset-password").value });
      if (!ok) { account.error = data.error; return resetDock(); }
      account.resetToken = null;
      account.user = data.user;
      showProfile();
    } catch (err) {
      account.error = "network";
      resetDock();
    }
  });
  document.getElementById("reset-password").focus({ preventScroll: true });
}
function openView(dock) {
  account.error = "";
  account.note = "";
  game.drawDock = dock;
  dock();
}
async function logIn(path) {
  const name = document.getElementById("login-name").value, password = document.getElementById("login-password").value;
  const email = document.getElementById("login-email").value;
  try {
    const { ok, data } = await api(path, path === "register" ? { name, password, email } : { name, password });
    if (!ok) { account.error = data.error; return loginDock(); }
    account.user = data.user;
    account.error = "";
    document.getElementById("login-password").value = "";
    showProfile();
  } catch (e) {
    account.error = "network";
    loginDock();
  }
}
function statRow(text, stat) {
  const s = S();
  const played = stat.score != null;
  return `<div class="stat ${played ? "" : "unplayed"}" title="${fill(s.answerCount, { n: num(stat.count) })}"><span>${esc(text)}</span>
    <div class="stat-track">${played ? `<i style="width:${stat.score}%"></i>` : ""}</div><b>${played ? (lang === "de" ? `${stat.score} %` : `${stat.score}%`) : "–"}</b></div>`;
}
function profileDock() {
  const s = S(), p = account.profile;
  const head = `<div class="profile-head"><h2>${esc(account.user.name)}${p && p.overall.score != null ? `<small>${fill(s.overall, { score: p.overall.score })}</small>` : ""}</h2>
    <div class="actions"><button class="quiet" id="logout" type="button">${s.logout}</button><button class="primary" id="account-back" type="button">${s.back}</button></div></div>`;
  const email = account.user.email;
  const emailPart = account.editingEmail ? `<form class="account-form" id="email-form">
      <label>${s.emailLabel}<input id="email-new" type="email" autocomplete="email" maxlength="254" spellcheck="false" value="${esc(email)}"></label>
      <label>${s.currentPassword}<input id="email-password" type="password" autocomplete="current-password" maxlength="200" required></label>
      <p class="account-error" role="alert">${account.note && account.note !== "saved" ? errorText(account.note === "wrong" ? "current" : account.note) : ""}</p>
      <div class="actions"><button class="primary" type="submit">${s.save}</button><button class="quiet" id="email-cancel" type="button">${s.cancel}</button></div>
    </form>` : `<p class="email-line"><span>${email ? esc(fill(s.emailNow, { email })) : s.noEmail}</span>
      <button class="link-button" id="email-edit" type="button">${email ? s.changeEmail : s.addEmail}</button></p>
      <p class="account-ok" role="status">${account.note === "saved" ? s.emailSaved : ""}</p>`;
  let body = emailPart;
  if (account.error) body += `<p class="account-error" role="alert">${s.profileError}</p>`;
  else if (p && !p.overall.count) body += `<p class="account-note">${s.noAnswers}</p>`;
  else if (p) {
    const dateText = at => new Date(at * 1000).toLocaleDateString(lang, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    /* A map only shows up once it has been played. Antarctica only has two mountains, so it waits until someone meets them. */
    const worlds = Object.entries(p.worlds).filter(([, st]) => st.overall.count);
    body += worlds.map(([world, st]) => {
      const regions = Object.entries(st.regions).filter(([r, rs]) => r !== "Antarctica" || rs.count);
      return `${worlds.length > 1 ? `<h3 class="world-head">${s.worlds[world]}</h3>` : ""}<div class="stats">
        <div><h3>${s.statsKinds}</h3>${kindsFor(world).map(k => statRow(W("kinds", world)[k], st.kinds[k])).join("")}</div>
        <div><h3>${s.statsRegions}</h3>${regions.map(([r, rs]) => statRow(s.regions[r], rs)).join("")}</div>
      </div>`;
    }).join("") + `
      <p class="account-note">${fill(s.accuracyNote, { n: p.window })}</p>
      <div><div class="log-head">${s.statsRounds}</div><ol class="log">${p.rounds.map(r => `<li>
        <span>${esc(dateText(r.at))} · ${s.regions[r.area]} · ${s.levels[r.level]} · ${r.kinds.map(k => W("kinds", r.world)[k]).join(", ")}</span><b>${num(r.points)} / ${num(r.answered * 100)}</b></li>`).join("")}</ol></div>`;
  }
  const typed = keep(["email-new", "email-password"]);
  setDock(`<div class="wrap">${head}${body}</div>`);
  if (account.editingEmail && typed["email-password"]) restore(typed);
  document.getElementById("account-back").onclick = account.back;
  document.getElementById("logout").onclick = logOut;
  const edit = document.getElementById("email-edit");
  if (edit) edit.onclick = () => { account.editingEmail = true; account.note = ""; profileDock(); document.getElementById("email-new").focus({ preventScroll: true }); };
  const form = document.getElementById("email-form");
  if (!form) return;
  document.getElementById("email-cancel").onclick = () => { account.editingEmail = false; account.note = ""; profileDock(); };
  form.addEventListener("submit", async e => {
    e.preventDefault();
    try {
      const { ok, data } = await api("email", { email: document.getElementById("email-new").value, password: document.getElementById("email-password").value });
      if (ok) { account.user = data.user; account.editingEmail = false; account.note = "saved"; }
      else account.note = data.error;
    } catch (err) {
      account.note = "network";
    }
    profileDock();
  });
}
async function showProfile() {
  account.profile = null;
  account.error = "";
  account.note = "";
  account.editingEmail = false;
  game.drawDock = profileDock;
  profileDock();
  try {
    const { ok, status, data } = await api("profile");
    if (game.drawDock !== profileDock) return;
    if (status === 401) { account.user = null; return openLogin(); }
    if (ok) account.profile = data; else account.error = "network";
  } catch (e) {
    account.error = "network";
  }
  if (game.drawDock === profileDock) profileDock();
}
function openLogin() {
  openView(loginDock);
}
async function logOut() {
  try {
    await api("logout", {});
    account.user = null;
    account.profile = null;
    account.back();
  } catch (e) {
    account.error = "network";
    profileDock();
  }
}
accountButton.onclick = () => {
  /* Only reachable between rounds. Coming back to a finished round shows its summary again. */
  if (game.phase !== "account") account.back = game.phase === "summary" ? renderSummary : renderSetup;
  game.phase = "account";
  music.end();
  if (account.user) showProfile(); else openLogin();
};
async function loadAccount() {
  try {
    const { ok, data } = await api("me");
    if (!ok) return;
    account.available = true;
    account.mail = data.mail;
    account.user = data.user;
  } catch (e) {
    return;
  }
  if (account.resetToken) {
    account.back = renderSetup;
    game.phase = "account";
    return openView(resetDock);
  }
  if (game.phase === "setup") game.drawDock();
  /* Someone who opened the login before this answer arrived is already logged in. */
  else if (game.drawDock === loginDock && account.user) showProfile();
  else drawAccountButton();
}

/* ---------- Sound effects ---------- */
/* Short synthesised sounds for answers. They have their own switch, follow the music's volume slider,
   and use their own audio context, so they play even while the music is off. */
const effects = (() => {
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let ctx = null, on = true;
  try { on = localStorage.getItem("blank-map-effects") !== "off"; } catch (e) {}
  const hz = midi => 440 * Math.pow(2, (midi - 69) / 12);
  function tone(out, midi, start, length, type, level) {
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(hz(midi), start);
    gain.gain.setValueAtTime(.0001, start);
    gain.gain.exponentialRampToValueAtTime(level, start + .012);
    gain.gain.exponentialRampToValueAtTime(.0001, start + length);
    osc.connect(gain).connect(out);
    osc.start(start);
    osc.stop(start + length + .02);
    return osc;
  }
  const SOUNDS = {
    /* A bright rising arpeggio, like a little bell. */
    right: (out, t) => [72, 76, 79, 84].forEach((m, i) => {
      tone(out, m, t + i * .07, .55, "sine", .45);
      tone(out, m + 12, t + i * .07, .22, "triangle", .1);
    }),
    /* Two softer notes for an answer that was close. */
    close: (out, t) => [72, 79].forEach((m, i) => tone(out, m, t + i * .1, .4, "sine", .32)),
    /* A low falling "bwomp", gentle enough to hear often. */
    wrong: (out, t) => {
      tone(out, 50, t, .5, "triangle", .5).frequency.exponentialRampToValueAtTime(hz(43), t + .42);
      tone(out, 57, t, .32, "sine", .2).frequency.exponentialRampToValueAtTime(hz(50), t + .3);
    },
  };
  function drawButton() {
    const button = document.getElementById("effects");
    button.hidden = !AudioCtx;
    button.textContent = on ? S().effectsOn : S().effectsOff;
    button.setAttribute("aria-pressed", String(on));
    button.setAttribute("aria-label", S().effectsLabel);
    button.title = S().effectsLabel;
  }
  document.getElementById("effects").onclick = () => {
    on = !on;
    try { localStorage.setItem("blank-map-effects", on ? "on" : "off"); } catch (e) {}
    drawButton();
    if (on) play("right");
  };
  function play(name) {
    if (!on || !AudioCtx || !music.volume) return;
    if (!ctx) ctx = new AudioCtx();
    ctx.resume();
    const out = ctx.createGain();
    out.gain.value = music.volume * .6;
    out.connect(ctx.destination);
    SOUNDS[name](out, ctx.currentTime + .02);
  }
  return { play, drawButton, SOUNDS };
})();
