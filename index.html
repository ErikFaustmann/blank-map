<meta charset="utf-8">
<title>Blank Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a full-bleed nautical chart with a docked title block below it. The palette follows
   chart conventions: buff land, tinted water, magenta for marked positions. Dark is night mode. */
:root {
  --sea: #cfe4ee; --land: #f1e4b8; --coast: #7d8a7c; --border: #a59a78; --grid: #a9c6d4;
  --panel: #f7fafa; --panel-2: #e8f0f2; --ink: #12303e; --muted: #4d6673; --line: #bfd0d6;
  --mark: #b0117a; --mark-ink: #ffffff; --pin: #12303e; --pick: #1769aa;
  --good: #1c7a4c; --ok: #a96a00; --bad: #bd3b1e;
  --display: "Barlow Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --sea: #0a1a26; --land: #38392a; --coast: #6f7a68; --border: #5c5f4b; --grid: #1c3444;
  --panel: #0f222e; --panel-2: #173140; --ink: #dfeaee; --muted: #9db3bd; --line: #2a4453;
  --mark: #f472c8; --mark-ink: #2a0a20; --pin: #ffffff; --pick: #58b4f0;
  --good: #5fce96; --ok: #e6ad4d; --bad: #f08a6c; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --sea: #0a1a26; --land: #38392a; --coast: #6f7a68; --border: #5c5f4b; --grid: #1c3444;
  --panel: #0f222e; --panel-2: #173140; --ink: #dfeaee; --muted: #9db3bd; --line: #2a4453;
  --mark: #f472c8; --mark-ink: #2a0a20; --pin: #ffffff; --pick: #58b4f0;
  --good: #5fce96; --ok: #e6ad4d; --bad: #f08a6c; color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body { background: var(--sea); color: var(--ink); font: 15px/1.45 var(--body); overflow: hidden; }
* { box-sizing: border-box; }
#app { height: 100%; display: grid; grid-template-rows: minmax(0, 1fr) auto; }

#stage { position: relative; min-height: 0; overflow: hidden; background: var(--sea); }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#map.placing { cursor: crosshair; }
#map:active { cursor: grabbing; }
#map path { vector-effect: non-scaling-stroke; }
.sphere { fill: var(--sea); stroke: var(--grid); stroke-width: 1; }
.graticule { fill: none; stroke: var(--grid); stroke-width: .6; }
.land { fill: var(--land); stroke: var(--coast); stroke-width: .6; }
.borders { fill: none; stroke: var(--border); stroke-width: .6; stroke-linejoin: round; }
#map .hl-area { fill: var(--mark); fill-opacity: .62; stroke: var(--mark); stroke-width: 1.4; }
#map .hl-river { fill: none; stroke: var(--mark); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
#map .hl-river-halo { fill: none; stroke: var(--panel); stroke-width: 6; stroke-opacity: .75; stroke-linecap: round; stroke-linejoin: round; }
#map .hl-right { fill: var(--good); fill-opacity: .7; stroke: var(--good); stroke-width: 1.4; }
#map .hl-chosen { fill: var(--bad); fill-opacity: .6; stroke: var(--bad); stroke-width: 1.4; }
#map .sel-hover { fill: var(--pick); fill-opacity: .25; stroke: var(--pick); stroke-width: 1; pointer-events: none; }
#map .sel-pick { fill: var(--pick); fill-opacity: .7; stroke: var(--pick); stroke-width: 1.6; pointer-events: none; }
#map .gap { fill: none; stroke: var(--pin); stroke-width: 1.6; stroke-dasharray: 5 5; }
.m-dot { fill: var(--mark); stroke: var(--panel); stroke-width: 2; }
.m-ring { fill: none; stroke: var(--mark); stroke-width: 2.5; }
.m-peak { fill: var(--mark); stroke: var(--panel); stroke-width: 2; stroke-linejoin: round; }
.m-pin { fill: none; stroke: var(--pin); stroke-width: 2.5; }
.m-pin-c { fill: var(--pin); }
.m-pin-halo { fill: none; stroke: var(--panel); stroke-width: 5; stroke-opacity: .7; }

#zoomctl { position: absolute; display: grid; gap: 6px;
  top: calc(12px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); }
#zoomctl button { width: 38px; height: 38px; padding: 0; font: 600 20px/1 var(--body); }
#lang { position: absolute; display: flex;
  top: calc(12px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); }
#lang button { min-width: 42px; height: 38px; padding: 0 10px; font: 600 15px/1 var(--display); letter-spacing: .06em; }
#lang button:first-child { border-radius: 3px 0 0 3px; }
#lang button:last-child { border-radius: 0 3px 3px 0; margin-left: -1px; }
#lang button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
#readout { position: absolute; bottom: 8px; left: max(12px, env(safe-area-inset-left, 0px));
  font: 12px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; pointer-events: none; }
@media (hover: none) { #readout { display: none; } }

#dock { background: var(--panel); border-top: 2px solid var(--ink); max-height: 66vh; overflow-y: auto;
  padding-block: 14px calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1120px; margin-inline: auto; display: grid; gap: 10px; }

button { font: 500 14px/1.2 var(--body); color: var(--ink); background: var(--panel); border: 1px solid var(--ink);
  border-radius: 3px; padding: 9px 14px; cursor: pointer; }
button:hover:not(:disabled) { background: var(--panel-2); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--mark); border-color: var(--mark); color: var(--mark-ink); font-weight: 600; }
button.primary:hover:not(:disabled) { background: var(--mark); filter: brightness(1.1); }
button.quiet { border-color: var(--line); color: var(--muted); }
:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }

/* Setup */
.setup { grid-template-columns: minmax(180px, 250px) minmax(0, 1fr); gap: 14px 32px; }
.brand h1 { font: 700 44px/.95 var(--display); margin: 0 0 6px; letter-spacing: .005em; text-transform: uppercase; }
.brand p { margin: 0 0 12px; color: var(--muted); }
.brand small { display: block; color: var(--muted); font-size: 12px; line-height: 1.4; }
.options { display: grid; gap: 10px; min-width: 0; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { padding: 0; margin-bottom: 5px; font: 600 15px/1.2 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; margin: 0; width: 100%; height: 100%; cursor: pointer; }
.chip span { display: block; padding: 7px 12px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); }
.chip span i { font: 12px var(--mono); font-style: normal; color: var(--muted); margin-left: 5px; }
.chip input:checked + span { background: var(--ink); border-color: var(--ink); color: var(--panel); font-weight: 500; }
.chip input:checked + span i { color: inherit; }
.chip input:focus-visible + span { outline: 3px solid var(--mark); outline-offset: 2px; }
.start { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.start button { padding: 11px 28px; font-size: 16px; }
.start span { color: var(--muted); }

/* In play */
.status { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 16px; }
.eyebrow { font: 600 15px/1.2 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.total { font: 500 13px var(--mono); font-variant-numeric: tabular-nums; }
.tally { display: flex; gap: 3px; list-style: none; margin: 0; padding: 0; }
.tally li { width: 20px; height: 6px; background: var(--panel-2); }
.tally li.now { background: var(--ink); }
.tally li.good { background: var(--good); } .tally li.ok { background: var(--ok); } .tally li.bad { background: var(--bad); }
.prompt { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px; }
.prompt > div:first-child { min-width: 0; flex: 1 1 300px; }
.prompt h2 { font: 600 34px/1.05 var(--display); margin: 0; text-wrap: balance; }
.prompt p { margin: 3px 0 0; color: var(--muted); }
.prompt h2 .target { color: var(--mark); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.answer-form { display: flex; flex-wrap: wrap; gap: 8px; flex: 1 1 340px; max-width: 560px; }
.answer-form input { flex: 1 1 180px; min-width: 0; padding: 9px 12px; font: 500 16px var(--body); color: var(--ink);
  background: var(--panel); border: 1px solid var(--ink); border-radius: 3px; }
.verdict { display: inline-block; font: 600 13px/1 var(--mono); padding: 4px 7px; border-radius: 2px; color: var(--panel); margin-right: 8px; vertical-align: 4px; font-variant-numeric: tabular-nums; }
.verdict.good { background: var(--good); } .verdict.ok { background: var(--ok); } .verdict.bad { background: var(--bad); }

/* Round summary */
.summary-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px; }
.summary-head h2 { font: 700 40px/1 var(--display); margin: 0; font-variant-numeric: tabular-nums; }
.summary-head h2 small { font: 500 24px var(--display); color: var(--muted); }
.rank { font: 600 20px var(--display); color: var(--mark); margin-left: 12px; }
.rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 0 28px; }
.rows button { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: baseline; width: 100%; text-align: left;
  background: none; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 7px 2px; }
.rows button em { font-style: normal; color: var(--muted); font-size: 13px; margin-left: 6px; }
.rows button b { font: 500 13px var(--mono); font-variant-numeric: tabular-nums; }
.rows button b.good { color: var(--good); } .rows button b.ok { color: var(--ok); } .rows button b.bad { color: var(--bad); }
.rows button.active { background: var(--panel-2); }

@media (max-width: 720px) {
  .setup { grid-template-columns: minmax(0, 1fr); }
  .brand h1 { font-size: 36px; }
  .brand small { display: none; }
  .brand p { margin-bottom: 0; }
  .prompt h2 { font-size: 28px; }
  .tally li { width: 14px; }
  #dock { max-height: 72vh; }
}
</style>

<div id="app">
  <div id="stage">
    <svg id="map" role="application" aria-label="World map"></svg>
    <div id="lang" role="group">
      <button type="button" data-lang="de">DE</button>
      <button type="button" data-lang="en">EN</button>
    </div>
    <div id="zoomctl">
      <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
      <button id="zoom-out" type="button" aria-label="Zoom out">&minus;</button>
      <button id="zoom-home" type="button" aria-label="Show the whole region" title="Show the whole region">&#8982;</button>
    </div>
    <div id="readout" aria-hidden="true"></div>
  </div>
  <section id="dock" aria-live="polite"></section>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="data.js"></script>
<script>
"use strict";
const DATA = window.BLANK_MAP_DATA;
const EARTH_KM = 6371;
const ROUND_LENGTH = 10;
const KINDS = ["country", "capital", "mountain", "river"];
const REGIONS = {
  World: { rotate: 0 },
  Africa: { rotate: 0, box: [-20, -36, 55, 38] },
  Asia: { rotate: 0, box: [25, -12, 150, 56] },
  Europe: { rotate: 0, box: [-25, 34, 45, 71] },
  "North America": { rotate: 0, box: [-170, 7, -50, 74] },
  "South America": { rotate: 0, box: [-85, -57, -32, 14] },
  Oceania: { rotate: -165, box: [112, -48, 208, 23] },
};

/* ---------- Language ---------- */
const STRINGS = {
  en: {
    kinds: { country: "Countries", capital: "Capitals", mountain: "Mountains", river: "Rivers" },
    one: { country: "Country", capital: "Capital city", mountain: "Mountain", river: "River" },
    nameThis: { country: "Name this country", capital: "Name this capital city", mountain: "Name this mountain", river: "Name this river" },
    regions: { World: "World", Africa: "Africa", Asia: "Asia", Europe: "Europe", "North America": "North America", "South America": "South America", Oceania: "Oceania", Antarctica: "Antarctica" },
    types: { both: "Both", name: "Name it", find: "Find it" },
    intro: "Name places on an unlabelled world map, or find them from their name.",
    credit: "Map data: Natural Earth, public domain. Countries are the UN members plus Kosovo, Palestine, Taiwan and Vatican City. Borders are drawn for play and take no political position.",
    legendAsk: "What to ask", legendHow: "How to answer", legendWhere: "Where", start: "Start round",
    startNote: "{n} questions, up to 100 points each", startEmpty: "Choose something to ask about in this region.",
    question: "Question {i} of {n}", points: "pts", find: "Find {name}",
    hintPin: "Click the map to place your pin. Scroll or pinch to zoom.",
    hintCountry: "Click a country to colour it in. Scroll or pinch to zoom.",
    hintSpelling: "Small spelling mistakes are fine.", placeholder: "Type the name", answerLabel: "Your answer",
    skip: "Skip", confirm: "Confirm", answer: "Answer", next: "Next question", results: "See results",
    again: "Play again", change: "Change settings",
    skipped: "Skipped", correct: "Correct",
    rightCountry: "You coloured in the right country.",
    chose: "You chose {name}, {km} km away.", choseArea: "You chose another area, {km} km away.",
    pinNear: "Your pin is {km} km away, close enough for full points.", pinFar: "Your pin is {km} km away.",
    close: "Close enough: you typed “{typed}”.", typed: "You typed “{typed}”.",
    factCapital: "Capital: {name}.", capitalOf: "Capital of {name}.", about: "About {area}.",
    million: "million km²", river: "About {km} km long, flowing into {mouth}.",
    ranks: ["Uncharted waters", "Coastal pilot", "Ocean navigator", "Master cartographer"],
    zoomIn: "Zoom in", zoomOut: "Zoom out", home: "Show the whole region", language: "Language", map: "World map",
  },
  de: {
    kinds: { country: "Länder", capital: "Hauptstädte", mountain: "Berge", river: "Flüsse" },
    one: { country: "Land", capital: "Hauptstadt", mountain: "Berg", river: "Fluss" },
    nameThis: { country: "Wie heißt dieses Land?", capital: "Wie heißt diese Hauptstadt?", mountain: "Wie heißt dieser Berg?", river: "Wie heißt dieser Fluss?" },
    regions: { World: "Welt", Africa: "Afrika", Asia: "Asien", Europe: "Europa", "North America": "Nordamerika", "South America": "Südamerika", Oceania: "Ozeanien", Antarctica: "Antarktika" },
    types: { both: "Beides", name: "Benennen", find: "Finden" },
    intro: "Benenne Orte auf einer unbeschrifteten Weltkarte oder finde sie anhand ihres Namens.",
    credit: "Kartendaten: Natural Earth, gemeinfrei. Länder sind die UN-Mitglieder sowie Kosovo, Palästina, Taiwan und die Vatikanstadt. Die Grenzen dienen nur dem Spiel und sind keine politische Aussage.",
    legendAsk: "Was wird gefragt", legendHow: "Wie antworten", legendWhere: "Wo", start: "Runde starten",
    startNote: "{n} Fragen, jeweils bis zu 100 Punkte", startEmpty: "Wähle etwas aus, das es in dieser Region gibt.",
    question: "Frage {i} von {n}", points: "Pkt.", find: "Finde {name}",
    hintPin: "Klicke auf die Karte, um deine Nadel zu setzen. Scrolle oder ziehe mit zwei Fingern zum Zoomen.",
    hintCountry: "Klicke auf ein Land, um es einzufärben. Scrolle oder ziehe mit zwei Fingern zum Zoomen.",
    hintSpelling: "Kleine Tippfehler sind kein Problem.", placeholder: "Name eingeben", answerLabel: "Deine Antwort",
    skip: "Überspringen", confirm: "Bestätigen", answer: "Antworten", next: "Nächste Frage", results: "Zum Ergebnis",
    again: "Nochmal spielen", change: "Einstellungen ändern",
    skipped: "Übersprungen", correct: "Richtig",
    rightCountry: "Du hast das richtige Land eingefärbt.",
    chose: "Du hast {name} gewählt, {km} km entfernt.", choseArea: "Du hast ein anderes Gebiet gewählt, {km} km entfernt.",
    pinNear: "Deine Nadel ist {km} km entfernt, nah genug für die volle Punktzahl.", pinFar: "Deine Nadel ist {km} km entfernt.",
    close: "Nah genug: Du hast „{typed}“ eingegeben.", typed: "Du hast „{typed}“ eingegeben.",
    factCapital: "Hauptstadt: {name}.", capitalOf: "Hauptstadt von {name}.", about: "Rund {area}.",
    million: "Mio. km²", river: "Rund {km} km lang, mündet in {mouth}.",
    ranks: ["Unbekannte Gewässer", "Küstengewässer", "Hochseetauglich", "Meisterhafte Kartografie"],
    zoomIn: "Vergrößern", zoomOut: "Verkleinern", home: "Ganze Region zeigen", language: "Sprache", map: "Weltkarte",
  },
};
function storedLanguage() {
  try { const saved = localStorage.getItem("blank-map-lang"); if (STRINGS[saved]) return saved; } catch (e) {}
  return (navigator.language || "").toLowerCase().startsWith("de") ? "de" : "en";
}
let lang = storedLanguage();
const S = () => STRINGS[lang];
const fill = (text, vars = {}) => text.replace(/\{(\w+)\}/g, (_, k) => vars[k]);
const num = n => Math.round(n).toLocaleString(lang);
const label = item => item.names[lang];

/* ---------- Content ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const countriesObject = DATA.world.objects.countries;
const allFeatures = topojson.feature(DATA.world, countriesObject).features;

function countryGeometry(c) {
  if (c.point) return d3.geoCircle().center(c.point).radius(0.12)();
  const names = [c.shape, ...c.extra];
  return topojson.merge(DATA.world, countriesObject.geometries.filter(g => names.includes(g.properties.name)));
}
function areaKm2(geo) { return d3.geoArea(geo) * EARTH_KM * EARTH_KM; }
function roundArea(km2) {
  if (km2 >= 1e6) return `${(km2 / 1e6).toLocaleString(lang, { maximumFractionDigits: 1 })} ${S().million}`;
  return `${num(Math.round(km2 / 1000) * 1000)} km²`;
}
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const sentence = text => text[0].toUpperCase() + text.slice(1);

const ITEMS = [];
for (const c of DATA.countries) {
  const geo = countryGeometry(c);
  const size = Math.sqrt(areaKm2(geo));
  const country = { kind: "country", names: { en: c.name, de: c.de.name }, aliases: [...c.aliases, ...c.de.aliases], region: c.region, geo, size,
    full: 60, zero: clamp(1.2 * size, 300, 1200),
    fact() {
      const parts = [c.capital ? fill(S().factCapital, { name: lang === "de" ? c.capitalDe.name : c.capital }) : "", `${S().regions[c.region]}.`];
      if (size > 100) parts.push(fill(S().about, { area: roundArea(size * size) }));
      return parts.filter(Boolean).join(" ");
    } };
  ITEMS.push(country);
  if (c.capital) ITEMS.push({ kind: "capital", names: { en: c.capital, de: c.capitalDe.name },
    aliases: [...c.capitalAliases, ...c.capitalDe.aliases], region: c.region,
    geo: { type: "Point", coordinates: c.capitalCoord },
    full: 40, zero: clamp(1.5 * size, 400, 2000),
    fact() {
      const note = lang === "de" ? c.capitalDe.note : c.capitalNote;
      return fill(S().capitalOf, { name: label(country) }) + (note ? " " + note : "");
    } });
}
for (const m of DATA.mountains) ITEMS.push({ kind: "mountain", names: { en: m.name, de: m.de.name }, aliases: [...m.aliases, ...m.de.aliases], region: m.region,
  geo: { type: "Point", coordinates: m.coord }, full: 75, zero: 1500,
  fact: () => `${num(m.elevation)} m. ${sentence(lang === "de" ? m.de.range : m.range)}, ${lang === "de" ? m.de.where : m.where}.` });
for (const r of DATA.rivers) ITEMS.push({ kind: "river", names: { en: r.name, de: r.de.name }, aliases: [...r.aliases, ...r.de.aliases], region: r.region,
  geo: { type: "MultiLineString", coordinates: r.lines }, full: 50, zero: clamp(r.length * 0.4, 400, 1500),
  fact: () => fill(S().river, { km: num(r.length), mouth: lang === "de" ? r.de.mouth : r.mouth }) });

/* Everything a click can colour in: quiz countries, plus territories such as Greenland that aren't asked about. */
const claimed = new Set(DATA.countries.flatMap(c => [c.shape, ...c.extra]));
const quizCountries = ITEMS.filter(i => i.kind === "country");
const HITS = [
  ...quizCountries.map(item => ({ item, geo: item.geo })),
  ...allFeatures.filter(f => !claimed.has(f.properties.name)).map(f => ({ item: null, geo: f })),
].map(h => ({ ...h, bounds: d3.geoBounds(h.geo) }));
function hitAt(lonLat) {
  const [lon, lat] = lonLat;
  return HITS.find(({ bounds: [[w, s], [e, n]], geo }) =>
    lat >= s && lat <= n && (w <= e ? lon >= w && lon <= e : lon >= w || lon <= e) && d3.geoContains(geo, lonLat)) || null;
}

/* ---------- Answer matching ---------- */
function normalize(text) {
  return text.normalize("NFD").replace(/\p{M}/gu, "").toLowerCase()
    .replace(/[.'’ʻ`]/g, "").replace(/[-,/]/g, " ")
    .replace(/\bsaint\b/g, "st")
    .replace(/^(the|der|die|das|mount|mt|river|rio|lake)\s+/, "").replace(/\s+(river|mountain|fluss)$/, "")
    .replace(/\s+/g, " ").trim();
}
function editDistance(a, b) {
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const row = [i];
    for (let j = 1; j <= b.length; j++)
      row[j] = Math.min(prev[j] + 1, row[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = row;
  }

function applyLanguage() {
  const s = S();
  document.documentElement.lang = lang;
  document.getElementById("zoom-in").setAttribute("aria-label", s.zoomIn);
  document.getElementById("zoom-out").setAttribute("aria-label", s.zoomOut);
  const home = document.getElementById("zoom-home");
  home.setAttribute("aria-label", s.home);
  home.title = s.home;
  document.getElementById("lang").setAttribute("aria-label", s.language);
  document.getElementById("map").setAttribute("aria-label", s.map);
  document.querySelectorAll("#lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
}
document.querySelectorAll("#lang button").forEach(b => b.onclick = () => {
  if (b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  try { localStorage.setItem("blank-map-lang", lang); } catch (e) {}
  applyLanguage();
  game.drawDock();
});

window.blankMap = { ITEMS, matchAnswer, nearest, pointsFor, pointsForPick, hitAt, normalize, pickRound, game, projection, svg };
applyLanguage();
layout();
renderSetup();
window.addEventListener("resize", refit);
</script>
